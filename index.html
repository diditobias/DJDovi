<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="48x48" href="/favicon.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="DJDovi is a young DJ based in Johannesburg, South Africa, available for event bookings. Book DJ Dovi for parties, celebrations, and events across Johannesburg."
    />
    <meta name="robots" content="index, follow" />
    <meta name="author" content="DJDovi" />
    <meta name="theme-color" content="#050505" />

    <title>DJDovi | Johannesburg DJ &amp; Event Bookings</title>
    <link rel="canonical" href="https://djdovi.co.za/" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="DJDovi" />
    <meta property="og:locale" content="en_ZA" />
    <meta property="og:url" content="https://djdovi.co.za/" />
    <meta property="og:title" content="DJDovi | Johannesburg DJ &amp; Event Bookings" />
    <meta
      property="og:description"
      content="DJDovi is a young DJ based in Johannesburg, South Africa, available for event bookings. Book DJ Dovi for parties, celebrations, and events across Johannesburg."
    />
    <meta property="og:image" content="https://djdovi.co.za/images/photo2.jpg" />
    <meta property="og:image:alt" content="DJ Dovi performing at an event in Johannesburg" />

    <!-- Twitter / X -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="DJDovi | Johannesburg DJ &amp; Event Bookings" />
    <meta
      name="twitter:description"
      content="DJDovi is a young DJ based in Johannesburg, South Africa, available for event bookings."
    />
    <meta name="twitter:image" content="https://djdovi.co.za/images/photo2.jpg" />
  </head>
  <body>
    <!-- Netlify Forms: static form for build-time detection (React SPA) -->
    <form name="booking" netlify netlify-honeypot="bot-field" hidden>
      <input type="text" name="bot-field" />
      <input type="text" name="name" />
      <input type="email" name="email" />
      <input type="tel" name="phone" />
      <input type="text" name="event_date" />
      <input type="text" name="event_type" />
      <input type="text" name="venue_area" />
      <textarea name="event_details"></textarea>
    </form>

    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
